name: CI

# Intentionally validation-only. Production deployment remains a separately authorized manual
# operation documented in docs/DEPLOYMENT.md; do not add Cloudflare or provider secrets here.

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Application validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLURAY_COLLECTION_URL: https://www.blu-ray.com/community/collection.php?u=123456&categoryid=7
      TMDB_READ_ACCESS_TOKEN: ci-only-placeholder-token-not-used-for-network-access-000000000000000000000000
      SYNC_ADMIN_TOKEN: ci-only-placeholder-sync-secret-0000000000000000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare bindings
        run: npm run cf-typegen

      - name: Validate application
        run: npm run check

      - name: Audit production and development dependencies
        run: npm run audit:dependencies

      - name: Preview npm package contents
        run: npm pack --dry-run

      - name: Validate deployment bundle
        run: npm run deploy:dry-run
